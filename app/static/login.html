<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartMeet – Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sm-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Smart<span>Meet</span></a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto gap-1">
            <li class="nav-item">
              <a class="nav-link" href="index.html"
                ><i class="bi bi-house-fill me-1"></i>Home</a
              >
            </li>
          </ul>
          <div class="d-flex gap-2 mt-2 mt-lg-0">
            <a href="login.html" class="btn-nav-outline">Login</a>
            <a href="signup.html" class="btn-nav-pink">Sign Up</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Page -->
    <div
      class="space-bg d-flex align-items-center justify-content-center"
      style="min-height: calc(100vh - 60px); padding: 40px 0"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5">
            <!-- Header -->
            <div class="text-center mb-4">
              <div class="page-header-icon mx-auto mb-3">🔑</div>
              <h2 class="fw-900" style="font-size: 1.6rem">Welcome back!</h2>
              <p class="text-muted fw-700 small">
                Log in to your SmartMeet account
              </p>
            </div>

            <!-- Form card -->
            <div class="sm-card">
              <div class="sm-card-body">
                <div class="mb-3">
                  <label
                    class="form-label fw-800"
                    style="
                      font-size: 0.8rem;
                      color: var(--p2);
                      text-transform: uppercase;
                      letter-spacing: 0.06em;
                    "
                    >Username or Email</label
                  >
                  <input
                    type="text"
                    id="loginIdentifier"
                    class="form-control"
                    placeholder="@username or email@example.com"
                    style="
                      border: 2px solid #ddd6fe;
                      border-radius: 12px;
                      font-weight: 700;
                    "
                  />
                </div>

                <div class="mb-3">
                  <label
                    class="form-label fw-800"
                    style="
                      font-size: 0.8rem;
                      color: var(--p2);
                      text-transform: uppercase;
                      letter-spacing: 0.06em;
                    "
                    >Password</label
                  >
                  <div style="position: relative">
                    <input
                      type="password"
                      id="loginPassword"
                      class="form-control"
                      placeholder="Enter your password"
                      style="
                        border: 2px solid #ddd6fe;
                        border-radius: 12px;
                        font-weight: 700;
                        padding-right: 44px;
                      "
                    />
                    <button
                      id="togglePassword"
                      type="button"
                      style="
                        position: absolute;
                        right: 12px;
                        top: 50%;
                        transform: translateY(-50%);
                        background: none;
                        border: none;
                        cursor: pointer;
                        color: var(--muted);
                        font-size: 1rem;
                      "
                    >
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-4"
                >
                  <div class="form-check mb-0">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="rememberMe"
                    />
                    <label
                      class="form-check-label fw-700 small"
                      for="rememberMe"
                      >Remember me</label
                    >
                  </div>
                  <a
                    href="#"
                    class="fw-700 small"
                    style="color: var(--p2); text-decoration: none"
                    >Forgot password?</a
                  >
                </div>

                <div
                  id="loginFeedback"
                  class="mb-3"
                  style="
                    display: none;
                    font-size: 0.85rem;
                    font-weight: 700;
                    padding: 10px 14px;
                    border-radius: 12px;
                  "
                ></div>

                <button
                  id="loginBtn"
                  class="btn-join w-100 text-center"
                  style="display: block"
                >
                  🔑 Login
                </button>

                <hr style="border-color: #ede9fe; margin: 20px 0" />

                <p class="text-center text-muted small fw-700 mb-0">
                  Don't have an account?
                  <a
                    href="signup.html"
                    style="
                      color: var(--p2);
                      text-decoration: none;
                      font-weight: 800;
                    "
                    >Sign Up</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="py-4 text-center">
      <div class="container">
        <p class="mb-0 small">
          © 2026 SmartMeet · CITS3403 Project · University of Western Australia
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // ── Toggle password visibility ──
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const input = document.getElementById("loginPassword");
          const icon = this.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
          }
        });

      // ── Login button ──
      document
        .getElementById("loginBtn")
        .addEventListener("click", function () {
          const identifier = document
            .getElementById("loginIdentifier")
            .value.trim();
          const password = document
            .getElementById("loginPassword")
            .value.trim();
          const feedback = document.getElementById("loginFeedback");

          if (!identifier || !password) {
            feedback.textContent = "⚠️ Please fill in all fields.";
            feedback.style.background = "#fef3c7";
            feedback.style.color = "#92400e";
            feedback.style.display = "";
            return;
          }

          // TODO: connect to Flask login route when backend is set up
          // For now simulate a successful login
          feedback.textContent = "✅ Logging you in...";
          feedback.style.background = "#d1fae5";
          feedback.style.color = "#065f46";
          feedback.style.display = "";

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        });

      // ── Allow Enter key to submit ──
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });
    </script>
  </body>
</html>
